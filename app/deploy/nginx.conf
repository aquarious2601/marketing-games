# P03 R20-R22. Installed by provision.sh, which substitutes __DOMAIN__ and
# __PHP_VERSION__. Certbot rewrites this file when it issues the certificate,
# adding the TLS server block and the redirect.
#
# The shape matters: the frontend is served as static files and /api is
# proxied to PHP-FPM on the same host, so the browser only ever talks to one
# origin. That is the same arrangement Vite's dev proxy creates (P00 R7), and
# it is why there is no CORS configuration anywhere in this project.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The release's built frontend. `current` is a symlink, so a deploy is a
    # symlink swap and nginx picks it up without a restart (P03 R5).
    root /srv/roulette/current/frontend-dist;
    index index.html;

    # The logo an admin uploaded can be a few hundred KB; a player's request
    # never carries a body worth more than that.
    client_max_body_size 8M;

    # Asked for by the deploy's own check and by nothing else (P03 R17).
    access_log /var/log/nginx/roulette.access.log;
    error_log  /var/log/nginx/roulette.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets, so those files are
    # immutable and may be cached forever. index.html must never be, or a
    # returning phone keeps the previous release's JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;

        # Resolved through the symlink deliberately: $realpath_root gives
        # PHP the release's own directory, so opcache keys its compiled
        # files per release and a deploy cannot serve a mix of two.
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Symfony reads this to decide whether the request was secure, which
        # is what makes the session cookie `secure` in production (P03 R22).
        # Certbot's TLS block inherits it; on plain HTTP it is simply wrong
        # in the harmless direction, and plain HTTP redirects anyway.
        fastcgi_param HTTPS on;

        root /srv/roulette/current/backend/public;

        internal;
        fastcgi_read_timeout 30s;
    }

    # Nothing else may reach PHP. Without this, any .php file that ever lands
    # under the document root becomes executable by a visitor.
    location ~ \.php$ {
        return 404;
    }

    # P03 R21: the frontend is a single-page application, so a URL that is
    # not a file is a route inside it, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
