# F12 R13: one file per language. A translator edits one of these and needs
# to know nothing else about the application.
#
# English is the source and the fallback (F12 R2): every key lives here
# first, and a key missing from another language falls back to this text
# rather than showing a raw key on screen. TranslationsTest fails if any
# language's key set has drifted from this one (F12 R14).
#
# Placeholders are %named%, never positional, so a translator can move them
# to wherever the sentence needs them.

api:
    invalid_json: 'The request body is not valid JSON.'
    invalid_object: 'The request body must be a JSON object.'
    internal_error: 'Internal server error'
    sign_in_required: 'You need to sign in.'

auth:
    # F07 R12: the same message whichever half was wrong, so the page cannot
    # become a way of finding out who has an account.
    bad_credentials: 'That username or password is not right.'
    nobody_signed_in: 'Nobody is signed in.'

player:
    details_invalid: 'Those details could not be used.'
    spin_requires_identity: 'Tell us who you are before you spin.'
    spin_already_used: 'You have already had your spin. Press Next customer to pass the phone on.'
    spin_limit_reached: 'You have already played today. Come back tomorrow.'
    no_game: 'This page needs the link from the stall.'
    phone_required: 'Enter your phone number.'
    phone_invalid: 'That does not look like a phone number. It needs between %min% and %max% digits.'
    first_name_required: 'Enter your first name.'
    last_name_required: 'Enter your last name.'
    first_name_too_long: 'A first name can be at most %max% characters.'
    last_name_too_long: 'A last name can be at most %max% characters.'
    birthday_required: 'Choose the day and month of your birthday.'
    birthday_invalid: 'Choose a day from 1 to 31 and a month.'
    birthday_impossible: 'That day does not exist in that month.'

wheel:
    invalid: 'The wheel configuration is invalid.'
    prizes_required: 'A list of prizes is required.'
    prizes_must_be_list: 'The prizes must be a list.'
    prize_must_be_object: 'Each prize must be an object.'
    too_few_prizes: 'A wheel needs at least %min% prizes. It has %count%.'
    too_many_prizes: 'A wheel can have at most %max% prizes. It has %count%.'
    prize_id_invalid: 'A prize id must be a positive whole number, or absent for a new prize.'
    probability_not_whole: 'A probability must be a whole number.'
    probability_out_of_range: 'A probability must be between %min% and %max%.'
    probability_total: 'The probabilities must total %required%. They currently total %total%.'
    prize_gone: 'This prize no longer exists. Reload the page and try again.'
    prize_reward_required: 'Choose what this slice gives away.'
    unknown_reward: 'That reward no longer exists. Reload the page and try again.'
    one_losing_slice: 'A wheel can have only one losing slice.'
    # Not rendered anywhere since F26: no slice carries a label of its own.
    # Kept because DatabaseUpgrade::defaultNamesToKeys() matches the labels an
    # old database still holds against the rewards it seeds, and this is the
    # one it looks for on the losing slice. Changing the words here would stop
    # that match working, which is a fragility the F13 steps have for every
    # default name and not something F26 introduced.
    default_losing_label: 'Try again'

branding:
    invalid: 'The branding is invalid.'
    must_be_text: 'This must be text.'
    too_long: 'This can be at most %max% characters.'
    choose_one_of: 'Choose one of: %values%.'

logo:
    required: 'Choose an image to upload.'
    not_an_image: 'That file is not an image.'
    too_large: 'The logo must be %max%MB or smaller.'
    wrong_type: 'The logo must be a PNG, JPEG, WebP or SVG image.'
    upload_failed: 'The upload did not complete. Please try again.'
    svg_unreadable: 'That SVG could not be read. Please export it again.'
    svg_entities: 'That SVG declares XML entities, which are not allowed. Export it without them and try again.'
    sanitised_notice: 'Some content was removed from the SVG for safety: %removed%.'

# Shown in the admin's theme picker. The application's own words, so they
# are translated (F12 R9) — unlike anything the admin types (F12 R10).
# F35 R23. The background a game can wear. Every rejection names the thing
# that was wrong with the file, so the next attempt is informed.
background:
    required: 'Choose a picture to upload.'
    not_an_image: 'That file is not an image.'
    too_large: 'The picture must be %max%MB or smaller. That one is %size%MB.'
    wrong_type: 'The picture must be a PNG, JPEG or WebP image.'
    too_small: 'The picture must be at least %min% pixels on its longest side. That one is %width%×%height%.'
    too_big: 'The picture must be at most %max% pixels on each side. That one is %width%×%height%.'
    upload_failed: 'The upload did not complete. Please try again.'

theme:
    plain: 'Plain'
    black-friday: 'Black Friday'
    christmas: 'Christmas'
    new-year: 'New Year'
    halloween: 'Halloween'
    birthday: 'Happy Birthday'
    custom: 'Custom'

# F12 R11: supplied by the application when the admin has set no tagline of
# their own, so it is ours to translate. An admin's own tagline never is.
tagline:
    default: 'One spin, one prize. Good luck.'
    sheet_default: 'Fill this in and the gifts are yours.'

# F13: the reward catalogue. The type names and the defaults are the
# application's own words; a reward the admin has renamed is not (F13 R29).
reward:
    type:
        free_product: 'Free product'
        percent_off: 'Percentage off'
        amount_off: 'Amount off'
        nothing: 'Nothing'
    default_losing: 'Maybe next time'
    default_5_percent: '5% off your next order'
    default_10_percent: '10% off your next order'
    default_free_sample: 'Free sample'
    default_free_gift: 'Free gift'
    default_grand_prize: 'Grand prize'
    invalid: 'That reward could not be saved.'
    name_required: 'A reward needs a name.'
    name_too_long: 'A reward name can be at most %max% characters.'
    name_taken: 'There is already a reward called that.'
    type_invalid: 'Choose one of: %values%.'
    value_required: 'This type of reward needs a value.'
    percent_out_of_range: 'A percentage must be between %min% and %max%.'
    amount_too_small: 'An amount must be at least %min%.'
    amount_too_large: 'An amount cannot be more than %max%.'
    value_not_allowed: 'This type of reward does not take a value.'
    cost_invalid: 'A cost must be a whole amount of money, and cannot be negative.'
    cost_not_allowed: 'The losing item costs nothing to give away, so it takes no cost.'
    in_use: 'This reward is on the wheel: %slices%. Point those slices at something else first.'
    not_found: 'That reward does not exist.'

spin:
    not_claimable: 'A losing spin cannot be claimed.'

store:
    basket_invalid: 'An average basket must be a whole amount of money, and cannot be negative.'
    language_invalid: 'Choose one of the languages the game speaks.'
    timezone_invalid: 'That is not a timezone this server recognises.'

game:
    type_wheel: 'Prize wheel'
    type_gift_sheet: 'Gift sheet'
    type_invalid: 'Choose what kind of game this is.'
    type_is_fixed: 'A game keeps the kind it was created as. Create another game instead.'
    name_required: 'Give this game a name.'
    name_too_long: 'A name can be at most %max% characters.'
    tagline_too_long: 'A tagline can be at most %max% characters.'
    daily_limit_invalid: 'Plays per day must be a whole number from 1 to %max%, or blank for no limit.'
    live_must_be_boolean: 'Say whether the game is live.'
    not_found: 'No such game.'
    delete_live: 'Turn this game off before deleting it.'
    delete_played: 'This game has been played %count% times. A game with plays cannot be deleted — its record is what it gave away.'
    not_ready_no_wheel: 'This game has no wheel yet.'
    not_ready_prize_count: 'A wheel needs between %min% and %max% prizes.'
    not_ready_slice_without_reward: 'Every slice needs a reward before this game can go live.'
    not_ready_total: 'The probabilities total %total%. They must total %required%.'
    not_ready_empty_sheet: 'This game gives nothing away yet. Add a gift first.'

sheet:
    invalid: 'The gift list is invalid.'
    too_many: 'A sheet can hold at most %max% gifts.'
    reward_required: 'Choose what this gift gives away.'
    reward_unknown: 'That reward no longer exists.'
    no_losing_reward: 'A sheet gives everything on it, so it cannot include the losing reward.'
    reward_twice: 'This reward is already on the sheet.'

stats:
    range_invalid: 'That range of days cannot be read.'
    day_invalid: 'A day must be written as YYYY-MM-DD.'
    from_after_to: 'The first day cannot be after the last.'
    range_too_long: 'A range cannot be longer than %max% days.'
