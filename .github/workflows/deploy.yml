# P03. Test, build, ship, verify.
#
# Runs only on main, because main is what is deployed. Features reach it
# through a sprint branch — see features/README.md — so by the time a commit
# lands here its suites have already been green on a pull request. They run
# again anyway: the gate that matters is the one in front of the thing it
# guards (P03 R18).
#
# Nothing here holds a long-lived credential. GitHub assumes an AWS role
# through OIDC (R3) and the instance pulls the release with its own role, so
# neither side holds a key to the other.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# P03 section 10: two pushes in quick succession deploy one after the other
# rather than racing for the symlink. Never cancelled mid-flight — a
# half-finished deploy is worse than a slow one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for the OIDC token used to assume the AWS role

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy
    needs: tests
    runs-on: ubuntu-latest

    # Skipped until the AWS side of P03's runbook exists, so pushing this
    # workflow before the instance does gives a green CI run rather than a
    # red deploy failing on an empty role ARN. It starts working by itself
    # the moment INSTANCE_ID is set in the repository's variables.
    if: vars.INSTANCE_ID != ''

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, xml, zip
          coverage: none

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: roulette/frontend/package-lock.json

      # R2: production dependencies only, and an authoritative classmap, so
      # the instance never resolves a class at runtime.
      - name: Build the backend
        working-directory: roulette/backend
        env:
          APP_ENV: prod
        run: |
          composer install --no-dev --prefer-dist --no-progress \
            --no-interaction --optimize-autoloader --classmap-authoritative

      - name: Build the frontend
        working-directory: roulette/frontend
        run: |
          npm ci
          npm run build

      # R2: one tarball per commit, holding only what the instance runs.
      - name: Pack the release
        run: |
          sha="${GITHUB_SHA}"
          staging="$(mktemp -d)"

          mkdir -p "$staging/backend" "$staging/deploy"

          # Everything the application needs, and nothing it does not: no
          # tests, no .env of the developer's, no node_modules.
          tar -C roulette/backend \
              --exclude=./var \
              --exclude=./tests \
              --exclude=./.env.local \
              --exclude=./.env.test \
              -cf - . | tar -C "$staging/backend" -xf -

          cp -r roulette/frontend/dist "$staging/frontend-dist"
          cp roulette/deploy/deploy.sh roulette/deploy/rollback.sh "$staging/deploy/"
          chmod +x "$staging/deploy/"*.sh

          tar -C "$staging" -czf "release-${sha}.tar.gz" .
          ls -lh "release-${sha}.tar.gz"

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the release
        run: |
          aws s3 cp "release-${GITHUB_SHA}.tar.gz" \
            "s3://${{ vars.RELEASE_BUCKET }}/releases/release-${GITHUB_SHA}.tar.gz"

      # R4: the instance is told to deploy; nothing connects to it.
      - name: Install it on the instance
        run: |
          set -Eeuo pipefail
          sha="${GITHUB_SHA}"

          # set -eu, not set -Eeuo pipefail: AWS-RunShellScript executes
          # with /bin/sh, which is dash on Ubuntu, where -o pipefail and -E
          # do not exist and abort the script on line 1. There are no pipes
          # in these commands. deploy.sh keeps the stricter set because it
          # is invoked with bash.
          #
          # And nothing inside the commands=[...] value may be commented:
          # it is a JSON string, so a # line is text the parser chokes on.
          command_id="$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${sha:0:7}" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"set -eu\",
              \"release=/srv/roulette/releases/${sha}\",
              \"rm -rf \\\"\$release\\\" && mkdir -p \\\"\$release\\\"\",
              \"aws s3 cp s3://${{ vars.RELEASE_BUCKET }}/releases/release-${sha}.tar.gz /tmp/release-${sha}.tar.gz\",
              \"tar -C \\\"\$release\\\" -xzf /tmp/release-${sha}.tar.gz\",
              \"rm -f /tmp/release-${sha}.tar.gz\",
              \"bash \\\"\$release/deploy/deploy.sh\\\" ${sha}\"
            ]" \
            --query 'Command.CommandId' --output text)"

          echo "SSM command: $command_id"

          # send-command returns immediately; this is what waits for it and
          # decides whether the job passed.
          if ! aws ssm wait command-executed \
                --command-id "$command_id" \
                --instance-id "${{ vars.INSTANCE_ID }}"; then
            echo "::error::The deploy failed on the instance."
          fi

          status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query 'Status' --output text)"

          echo "--- instance output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text

          if [[ "$status" != "Success" ]]; then
            echo "--- instance errors ---"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text
            echo "::error::Deploy finished as ${status}. The instance has rolled itself back (P03 R17)."
            exit 1
          fi

      # R17 proved from outside the instance as well as inside it: the check
      # in deploy.sh runs on localhost and would not notice nginx, TLS or the
      # security group being wrong.
      - name: Check it from the internet
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 -o /dev/null "https://${{ vars.DOMAIN }}/api/health"; then
              echo "https://${{ vars.DOMAIN }}/api/health is answering."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The site does not answer publicly, although the instance says it deployed."
          exit 1
